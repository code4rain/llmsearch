<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>llmsearch</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  nav button { margin-right: .5rem; padding: .4rem .8rem; cursor: pointer; }
  .tab { display: none; } .tab.active { display: block; }
  #messages { border: 1px solid #ccc; min-height: 300px; padding: 1rem; margin: 1rem 0;
              white-space: pre-wrap; overflow-y: auto; max-height: 60vh; }
  .msg-q { font-weight: bold; margin-top: 1rem; }
  .src { background: #f4f4f4; border-radius: 6px; padding: .5rem; margin: .3rem 0; font-size: .9rem; }
  .snip { color:#666; font-size:.85em; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .filters-note { color:#666; font-size:.85em; margin:.2rem 0 .4rem; }
  #question { width: 80%; padding: .5rem; } table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: .4rem .8rem; }
</style>
</head>
<body>
<h1>llmsearch</h1>
<div id="banner" style="display:none;background:#fff3cd;border:1px solid #e0c060;padding:.5rem;margin:.5rem 0"></div>
<nav>
  <button onclick="show('chat')">채팅</button>
  <button onclick="show('sources')">소스</button>
  <button onclick="show('log')">로그</button>
  <button onclick="show('settings')">설정</button>
</nav>

<div id="chat" class="tab active">
  <div id="messages"></div>
  <form onsubmit="ask(event)">
    <input id="question" placeholder="질문을 입력하세요" autocomplete="off">
    <button>검색</button>
  </form>
  <details id="filters"><summary>필터</summary>
    <div id="srcFilters"></div>
    <label>기간 <input type="date" id="fDateFrom"> ~ <input type="date" id="fDateTo"></label>
    <label>발신자 <input id="fSender" placeholder="kim@corp.com" title="입력 시 메일만 검색됩니다"></label>
    <small>입력 시 메일만 검색됩니다</small>
  </details>
</div>

<div id="sources" class="tab">
  <div id="usageLine"></div>
  <table id="srcTable"><thead><tr><th>소스</th><th>문서 수</th><th>마지막 동기화</th><th></th></tr></thead>
  <tbody></tbody></table>
  <h3>Confluence / Jira URL 등록</h3>
  <form onsubmit="registerUrl(event)">
    <input id="atlUrl" placeholder="https://wiki.../pageId=123 또는 .../browse/PROJ-1" style="width:70%">
    <button>등록</button>
  </form>
  <ul id="atlList"></ul>
  <h3>프로젝트 아카이브</h3>
  <ul id="projList"></ul>
</div>

<div id="log" class="tab"><pre id="logBody"></pre></div>

<div id="settings" class="tab">
  <h3>규칙 (rules.md) <small id="rulesPath"></small></h3>
  <p><small>섹션 헤더가 주입 위치를 정한다: ## 용어집(모든 LLM 호출) · ## 분류 규칙 · ## 요약 규칙 · ## 답변 규칙. 규칙 변경은 신규 문서부터 적용 — 기존 문서는 아래 재요약으로.</small></p>
  <textarea id="rulesText" style="width:100%;height:60vh;font-family:monospace"></textarea><br>
  <button id="saveRulesBtn" onclick="saveRules()">저장</button> <span id="rulesStatus"></span>
  <h3>운영</h3>
  <button id="resumAllBtn" onclick="resummarizeAll()">전체 재요약</button>
  <button id="rebuildBtn" onclick="rebuildIndex()">인덱스 재구축</button>
</div>

<script>
const history = [];
function show(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'sources') { loadSources(); loadRegistrations(); loadProjects(); }
  if (id === 'log') loadLog();
  if (id === 'settings') loadRules();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function loadUsage() {
  const u = await (await fetch('/api/usage')).json();
  const kinds = ['embed', 'summary', 'vision', 'answer'].map(k => `${k} ${u.today[k] || 0}`).join(' · ');
  let line = `오늘 API 호출 ${u.total}건 (${kinds}) · ` +
    (u.limit > 0 ? `일일 상한 ${u.total} / ${u.limit}건` : '일일 상한 없음');
  if (!u.indexing_allowed) line += ' ⚠️ 상한 도달 — 요약·인덱싱 일시정지 (검색·답변은 계속)';
  document.getElementById('usageLine').textContent = line;
}
async function loadSources() {
  loadUsage();
  loadStatus();
  const data = await (await fetch('/api/sources')).json();
  document.querySelector('#srcTable tbody').innerHTML = data.map(s =>
    `<tr><td>${esc(s.source)}${s.backlog === true ? ' <span title="백로그 수집 중">⏳ 수집 중</span>' : ''}</td>` +
    `<td>${esc(s.doc_count)}</td><td>${esc(s.last_sync ?? '-')}` +
    `${s.last_error ? ' ⚠️' : ''}</td>` +
    `<td><button onclick="syncNow('${esc(s.source)}')">동기화</button></td></tr>`).join('');
}
async function syncNow(source) {
  await fetch('/api/sync/' + source, {method: 'POST'});
  loadSources();
}
async function loadStatus() {
  const s = await (await fetch('/api/status')).json();
  const b = document.getElementById('banner');
  b.replaceChildren();
  let text = '', action = null;
  if (s.schema_mismatch) {
    text = 'index.db 스키마 불일치 — 재구축이 필요합니다 (요약 md는 재사용): ' + s.schema_mismatch;
    action = ['재구축', rebuildIndex];
  } else if (s.rebuilding) {
    text = '재구축 진행 중 — 소스 탭 문서 수·로그 탭을 참조하세요 (메일은 백로그로 이어집니다)';
  } else if (s.rebuild_in_progress) {
    text = '이전 재구축이 완료되지 않았습니다';
    action = ['재개', resumeRebuild];
  }
  if (!text) { b.style.display = 'none'; return; }
  b.append(document.createTextNode(text + ' '));
  if (action) { const btn = document.createElement('button'); btn.textContent = action[0]; btn.onclick = action[1]; b.append(btn); }
  b.style.display = 'block';
}
async function postRebuild(body) {
  const r = await fetch('/api/rebuild', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)});
  return [r, await r.json()];
}
async function rebuildIndex() {
  const srcs = await (await fetch('/api/sources')).json();
  const total = srcs.reduce((a, s) => a + (s.doc_count || 0), 0);
  if (!confirm(`인덱스를 초기화하고 전 소스를 다시 수집합니다 (현재 문서 ${total}건). 요약 md는 재사용되어 ` +
               `변경된 파일만 요약 API를 호출하지만, 임베딩은 전량 다시 호출되어 일일 상한을 초과할 수 있습니다. 계속할까요?`)) return;
  let [r, d] = await postRebuild({});
  if (r.status === 409 && d.missing_folders && d.missing_folders.length) {
    if (!confirm(`폴더를 찾을 수 없습니다:\n${d.missing_folders.join('\n')}\n\n건너뛰고 진행할까요? (해당 문서는 다음 동기화에서 재처리)`)) return;
    [r, d] = await postRebuild({force: true});
  }
  const msg = r.ok
    ? `재구축 시작 — 재수집 대상: ${d.targets.join(', ')}` +
      (d.legacy_maps_recovered === 0 ? '\n⚠️ 요약 md 매핑을 회수하지 못했습니다 — local_docs가 전량 재요약됩니다(요약 API 소모).' : '')
    : (d.detail || '재구축 실패');
  alert(msg);
  loadStatus(); loadSources();
}
async function resumeRebuild() {
  const r = await fetch('/api/rebuild/resume', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  const d = await r.json();
  alert(r.ok ? `재수집 재개 — 대상: ${d.targets.join(', ')}` : (d.detail || '재개 실패'));
  loadStatus();
}
async function openItem(p) {
  const r = await (await fetch('/api/open', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url_or_path: p})})).json();
  if (!r.ok) alert(r.error);
}
function resumMessage(r, d) {
  if (!r.ok) return d.detail || '실패';
  if (!d.ok) return d.error;
  return `재요약 완료: ${d.indexed}건` + (d.indexed === 0 ? ' (파일이 이미 없거나 상한/오류 — 로그 탭 확인)' : '');
}
async function resummarize(sid) {
  if (!confirm('이 문서를 다시 요약할까요? 요약 API를 호출합니다.')) return;
  const r = await fetch('/api/resummarize', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source_id: sid})});
  alert(resumMessage(r, await r.json()));
}
async function resummarizeAll() {
  const cr = await fetch('/api/resummarize/count');
  if (!cr.ok) { alert((await cr.json()).detail || '건수 조회 실패'); return; }
  const c = (await cr.json()).count;
  if (!confirm(`${c}건을 다시 요약합니다. 요약 API를 최소 ${c}회(비전 문서는 +1) 호출합니다.`)) return;
  const btn = document.getElementById('resumAllBtn'); btn.disabled = true;
  try {
    const r = await fetch('/api/resummarize', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({all: true})});
    alert(resumMessage(r, await r.json()));
  } finally { btn.disabled = false; }
}
async function loadRegistrations() {
  const regs = await (await fetch('/api/atlassian/registrations')).json();
  document.getElementById('atlList').innerHTML = regs.map(r =>
    `<li>${esc(r.kind === 'jira_issue' ? r.key : 'page ' + r.page_id)} — ` +
    `<code>${esc(r.url)}</code> ` +
    `<button onclick="removeReg(this.dataset.u)" data-u="${esc(r.url)}">삭제</button></li>`).join('');
}
async function registerUrl(e) {
  e.preventDefault();
  const url = document.getElementById('atlUrl').value.trim();
  if (!url) return;
  const r = await fetch('/api/atlassian/register', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})});
  if (!r.ok) alert((await r.json()).detail || '등록 실패');
  document.getElementById('atlUrl').value = '';
  loadRegistrations();
}
async function removeReg(u) {
  await fetch('/api/atlassian/registrations', {method: 'DELETE',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: u})});
  loadRegistrations();
}
async function loadProjects() {
  const ps = await (await fetch('/api/para/projects')).json();
  document.getElementById('projList').innerHTML = ps.map(p =>
    `<li>${esc(p.name)} (${esc(p.doc_count)}건) ` +
    `<button onclick="archiveProject(this.dataset.n)" data-n="${esc(p.name)}">완료 처리</button></li>`).join('');
}
async function archiveProject(name) {
  if (!confirm(`'${name}' 프로젝트를 Archives로 이동할까요? 검색 순위가 하향됩니다.`)) return;
  const r = await fetch('/api/archive', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({project: name})});
  let data = {};
  try { data = await r.json(); } catch { data = {detail: '서버 내부 오류 — 로그를 확인하세요'}; }
  alert(r.ok ? (data.hint || '완료') : (data.detail || '실패'));
  loadProjects(); loadSources();
}
async function loadLog() {
  const data = await (await fetch('/api/log')).json();
  document.getElementById('logBody').textContent = JSON.stringify(data, null, 2);
}
async function loadRules() {
  const r = await (await fetch('/api/rules')).json();
  document.getElementById('rulesText').value = r.text;  // .value — innerHTML 금지 (</textarea> XSS)
  document.getElementById('rulesPath').textContent = r.path;
  document.getElementById('rulesStatus').textContent = '섹션: ' + (r.sections.join(', ') || '(없음)');
}
async function saveRules() {
  const r = await fetch('/api/rules', {method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: document.getElementById('rulesText').value})});
  const data = await r.json();
  document.getElementById('rulesStatus').textContent =
    r.ok ? '저장됨 · 섹션: ' + (data.sections.join(', ') || '(없음)') : (data.detail || '저장 실패');
}
const SOURCES_UI = ['notes', 'local_docs', 'outlook_mail', 'outlook_cal', 'confluence', 'jira'];
document.getElementById('srcFilters').replaceChildren(...SOURCES_UI.map(s => {
  const l = document.createElement('label'); const c = document.createElement('input');
  c.type = 'checkbox'; c.className = 'srcChk'; c.dataset.src = s;
  l.append(c, ' ' + s + ' '); return l;
}));
function currentFilters() {
  const srcs = [...document.querySelectorAll('.srcChk:checked')].map(c => c.dataset.src);
  const v = id => document.getElementById(id).value.trim() || null;
  return {source_filter: srcs.length ? srcs : null, date_from: v('fDateFrom'), date_to: v('fDateTo'), sender: v('fSender')};
}
function filtersLabel(f) {
  const parts = [];
  if (f.source_filter) parts.push('소스=' + f.source_filter.join(','));
  if (f.date_from || f.date_to) parts.push('기간=' + (f.date_from || '') + '~' + (f.date_to || ''));
  if (f.sender) parts.push('발신자=' + f.sender);
  return parts.length ? '필터(첫 검색 기준): ' + parts.join(' · ') + ' — 답변 근거는 Claude의 추가 검색으로 넓어질 수 있습니다' : '';
}
async function ask(e) {
  e.preventDefault();
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  document.getElementById('question').value = '';
  const box = document.getElementById('messages');
  const qDiv = document.createElement('div');
  qDiv.className = 'msg-q';
  qDiv.textContent = 'Q. ' + q;
  box.appendChild(qDiv);
  const filters = currentFilters();
  const label = filtersLabel(filters);
  if (label) { const n = document.createElement('div'); n.className = 'filters-note'; n.textContent = label; box.appendChild(n); }
  const answerDiv = document.createElement('div');
  answerDiv.className = 'msg-a';
  box.appendChild(answerDiv);
  const resp = await fetch('/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q, history, filters}),
  });
  if (!resp.ok) {  // 400(필터 검증)·503(스키마 불일치) — 무증상 실패·history 오염 방지
    let d = {}; try { d = await resp.json(); } catch {}
    answerDiv.textContent = '⚠️ ' + (d.detail || ('HTTP ' + resp.status));
    return;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', answerText = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
      const ev = (block.match(/^event: (.+)$/m) || [])[1];
      const data = (block.match(/^data: (.+)$/m) || [])[1];
      if (ev === 'text') { answerText += JSON.parse(data); answerDiv.textContent = answerText; }
      else if (ev === 'error') { answerDiv.textContent += '\n⚠️ ' + JSON.parse(data); }
      else if (ev === 'sources') {
        for (const h of JSON.parse(data)) {
          const lock = h.content_indexed ? '' : ' 🔒';
          const resum = h.source_type === 'local_docs'
            ? ` <button onclick="resummarize(this.dataset.s)" data-s="${esc(h.source_id)}">재요약</button>` : '';
          answerDiv.insertAdjacentHTML('beforeend',
            `<div class="src">📄 ${esc(h.title)}${lock} <small>(${esc(h.source_type)} · ${esc(h.updated_at)})</small><br>` +
            `${h.snippet ? `<div class="snip">${esc(h.snippet)}</div>` : ''}` +
            `<code>${esc(h.url_or_path)}</code> ` +
            `<button onclick="openItem(this.dataset.p)" data-p="${esc(h.url_or_path)}">열기</button>${resum}</div>`);
        }
      }
      box.scrollTop = box.scrollHeight;
    }
  }
  history.push({role: 'user', content: q}, {role: 'assistant', content: answerText});
}
loadStatus();
</script>
</body>
</html>
